[[commands]]
name = "tar"

# withfig models tar's operation modes as subcommands; in real tar
# they are long options, so the conversion carries them as flags and
# the subcommand seat stays empty (completing `tar c` to `reate`
# would guess at old-style bundling nobody types).

[[commands.flags]]
name = "--append"
description = "Append files to the end of an archive"

[[commands.flags]]
name = "--block-number"
description = "Show block number within archive with each message"

[[commands.flags]]
name = "--create"
description = "Create a new archive"

[[commands.flags]]
name = "--delete"
description = "Delete from the archive"

[[commands.flags]]
name = "--diff"
description = "Find differences between archive and file system"

[[commands.flags]]
name = "--directory"
description = "Change to DIR before performing any operations"

[[commands.flags]]
name = "--exclude-from"
description = "Exclude files matching patterns listed in FILE"

[[commands.flags]]
name = "--extract"
description = "Extract files from an archive"

[[commands.flags]]
name = "--files-from"
description = "Get names to extract or create from FILE"

[[commands.flags]]
name = "--help"
description = "Display a short option summary and exit"

[[commands.flags]]
name = "--interactive"
description = "Ask for confirmation for every action"

[[commands.flags]]
name = "--list"
description = "List the contents of an archive"

[[commands.flags]]
name = "--no-recursion"
description = "Avoid descending automatically in directories"

[[commands.flags]]
name = "--numeric-owner"
description = "Always use numbers for user/group names"

[[commands.flags]]
name = "--show-defaults"
description = "Show built-in defaults for various tar options and exit"

[[commands.flags]]
name = "--show-transformed-names"
description = "Show file or archive names after transformation by --strip and --transform options"

[[commands.flags]]
name = "--sparse"
description = "Handle sparse files efficiently"

[[commands.flags]]
name = "--test-label"
description = "Test the archive volume label and exit"

[[commands.flags]]
name = "--totals"
description = "Print total bytes after processing the archive"

[[commands.flags]]
name = "--update"
description = "Append files which are newer than the corresponding copy in  the archive"

[[commands.flags]]
name = "--usage"
description = "Display a list of available options and exit"

[[commands.flags]]
name = "--verbose"
description = "Verbosely list files processed"

[[commands.flags]]
name = "--verbatim-files-from"
description = "Treat each line obtained from a file list as a file name, even if it starts with a dash"

[[commands.flags]]
name = "--version"
description = "Print program version and copyright information and exit"
