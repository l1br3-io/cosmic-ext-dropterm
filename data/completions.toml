# DropTerm's audited completions seed (suggest-specs-data).
#
# Copy this file to
#   ~/.config/cosmic/io.github.l1br3_io.CosmicExtDropterm/v1/completions.toml
# to extend the built-in table: every command here adds beside the
# built-in five, and a re-declared one (cargo, docker, git, npm,
# systemctl below) replaces its built-in entry whole — which is why
# each of the five carries the complete built-in entry set, now with
# descriptions. Descriptions render in the completion menu's dim
# second column; the ghost ignores them.
#
# Derivation and license: every subcommand, flag, and description is
# converted from withfig/autocomplete @ aef52acff84c (v2.692.3,
# 2025-05-05), MIT. Generators, templates, and scripts never cross
# the conversion — data only, and the file format structurally
# rejects executable content (unknown keys fail the whole file).
# Per-command derivations are named in
# docs/research/completions-seed-audit.md.
#
# Regeneration (a one-off, never a build step): the source specs are
# fetched at the pinned commit and hand-converted under the rules the
# audit record names —
#   curl -sfL https://raw.githubusercontent.com/withfig/autocomplete/aef52acff84c/src/<cli>.ts
# Conversion rules: top-level subcommands and long flags only; one
# name per entry (the first long form of a multi-name flag, the
# primary name of a multi-name subcommand); descriptions verbatim; no
# entry without a withfig counterpart at the spec's top level.
#
