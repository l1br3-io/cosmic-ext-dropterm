# The OSC 133 A/B/C carry (shell-integration SI-2, the
# alacritty-terminal discipline): a private copy of the exact
# l1br3-io/vte fork @ 52dadb7 (the OSC 133;D one-arm, itself based
# on the 0.15.0 crates.io publish) whose single change parses the
# three remaining FinalTerm semantic-prompt markers — 133;A (prompt
# start), 133;B (prompt end), 133;C (command start) — into
# default-no-op Handler methods beside the D arm; A and C become
# Term events one layer up (carried/alacritty-terminal), B stays
# parsed and never forwarded. The readme path is dropped (no README
# rides the carry). Upstream ask: alacritty/vte — the draft the
# header points at lives beside this carry (UPSTREAM.md, SI-7; no
# push — the ask-first boundary holds); retirement: the upstream
# merge, once released.
[package]
authors = ["Joe Wilm <joe@jwilm.com>", "Christian Duerr <contact@christianduerr.com>"]
description = "Parser for implementing terminal emulators"
repository = "https://github.com/alacritty/vte"
documentation = "https://docs.rs/vte/"
keywords = ["ansi", "vte", "parser", "terminal"]
categories = ["parsing", "no-std"]
exclude = ["/.travis.yml"]
license = "Apache-2.0 OR MIT"
version = "0.15.0"
name = "vte"
edition = "2021"
rust-version = "1.62.1"

[features]
ansi = ["log", "cursor-icon", "bitflags"]
default = ["std"]
std = ["memchr/std"]
serde = ["dep:serde"]

[dependencies]
arrayvec = { version = "0.7.2", default-features = false }
bitflags = { version = "2.3.3", default-features = false, optional = true }
cursor-icon = { version = "1.0.0", default-features = false, optional = true }
log = { version = "0.4.17", optional = true }
memchr = { version = "2.7.4", default-features = false }
serde = { version = "1.0.160", features = ["derive"], optional = true }
