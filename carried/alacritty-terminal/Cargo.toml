# The wide-reflow carry (ram-leak rl-3, kit-root-border precedent): a
# private copy of the exact l1br3-io/alacritty fork @ 1185ffd (the
# OSC 133;D one-arm, itself based on the 0.25.1 crates.io publish)
# whose single change guards `shrink_columns`' wide-char carry at one
# column — the immortal-row allocation bomb behind the 2026-11-17
# 47.1 GB kernel OOM. The workspace-inherited edition/rust-version
# are inlined (this copy stands alone); the readme path is dropped
# (no README rides the carry). Upstream ask: alacritty/alacritty —
# the same unguarded loop is in master today. Retirement: the
# upstream fix, once released.
[package]
name = "alacritty_terminal"
version = "0.25.1"
authors = ["Christian Duerr <contact@christianduerr.com>", "Joe Wilm <joe@jwilm.com>"]
license = "Apache-2.0"
description = "Library for writing terminal emulators"
homepage = "https://alacritty.org"
repository = "https://github.com/alacritty/alacritty"
edition = "2024"
rust-version = "1.85.0"

[features]
default = ["serde"]
serde = ["dep:serde", "bitflags/serde", "vte/serde"]

[dependencies]
base64 = "0.22.0"
bitflags = "2.4.1"
home = "0.5.5"
libc = "0.2"
log = "0.4"
parking_lot = "0.12.0"
polling = "3.8.0"
regex-automata = "0.4.3"
unicode-width = "0.2.0"
vte = { version = "0.15.0", default-features = false, features = ["std", "ansi"] }
serde = { version = "1", features = ["derive", "rc"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2.0"
rustix = { version = "1.0.0", default-features = false, features = ["std"] }
signal-hook = "0.3.10"

[target.'cfg(windows)'.dependencies]
piper = "0.2.1"
miow = "0.6.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]}

[dev-dependencies]
serde_json = "1.0.0"
