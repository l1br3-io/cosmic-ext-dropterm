[package]
name = "cosmic-ext-dropterm"
version = "0.3.0"
authors = ["l1br3-io"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"
description = "A native, Yakuake/Guake-style drop-down terminal for the COSMIC desktop"
repository = "https://github.com/l1br3-io/cosmic-ext-dropterm"

[[bin]]
name = "cosmic-ext-dropterm"
path = "src/main.rs"

[lib]
name = "cosmic_ext_dropterm"
path = "src/lib.rs"

[workspace]
members = [".", "applet"]

[workspace.dependencies]
# Bare URL, deliberately: libcosmic's own `applet` feature pulls
# cosmic-panel-config → cosmic-config from `pop-os/libcosmic` floating,
# and cargo only merges git references into ONE source when the spec
# strings match — a `rev =` pin here would put a second libcosmic
# source in the graph and break `cargo vendor` (duplicate crates).
# Reproducibility lives in the committed Cargo.lock (every recipe runs
# --locked); bump deliberately with
# `cargo update -p libcosmic --precise <sha>`.
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false }

# status-exit (OQ-1, decided 2026-11-03): the shell's own "command
# finished with code N" (OSC 133;D, FinalTerm/contour shell
# integration) is parsed nowhere upstream — vte 0.15.0's ansi table
# log-drops unknown codes and alacritty_terminal 0.25.1 holds no
# parser at all. Two one-arm forks carry the passthrough (branch
# dropterm-osc133d each, based on the exact crates.io publish
# commits, so the patched sources are the lockfile's versions plus
# the one arm): vte parses `133;D;<code>` into a default-no-op
# Handler method; alacritty_terminal implements it on Term, emitting
# Event::PromptExit(code). Unlike the bare libcosmic git URL above, a
# [patch.crates-io] entry REPLACES each crate's registry source
# rather than adding a second one, so cargo vendor still sees one
# source per crate. Upstreaming: PRs to alacritty/vte and
# alacritty/alacritty are the follow-up once the module proves out.
[patch.crates-io]
vte = { git = "https://github.com/l1br3-io/vte", rev = "61226f3e95bcf0b464933ec67a6f35fe8a99814c" }
alacritty_terminal = { git = "https://github.com/l1br3-io/alacritty", rev = "94ff9ffd30e7da69d4c8557684af6a7754452e78" }

[dependencies]
alacritty_terminal = "0.25.1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

# Bell → desktop notification (bell-notify spec): direct D-Bus
# org.freedesktop.Notifications. Default features are zbus-backed — the
# same zbus 5 libcosmic already pulls in, so it adds no new transitive
# dependencies (COSMIC has no Notification portal to use instead).
notify-rust = "4.18"
indexmap = "2"

# The status band's clock: `HH:MM` formatting and minute-boundary
# arithmetic. Version-matched to the 0.2.37 line libcosmic and
# env_logger already pull in, so no new code enters the build.
jiff = "0.2"

# Just `BitFlags::default()` — the empty `set_auto_blur` opt-out in
# `init`. Version-matched to the 0.7.12 line libcosmic already pulls
# in, so no new code enters the build.
enumflags2 = "0.7"

# `tcgetpgrp`/`getpgid` for foreground-process detection (close-confirm
# spec) — no safe std API exists for either. Version-matched to the
# 0.2.189 line alacritty_terminal already pulls in, so no new code
# enters the build (the enumflags2/zbus version-match precedent).
libc = "0.2"

# The font picker's enumeration (font-picker spec): walks the system
# font dirs once at startup. Version-matched to the 0.23.0 line
# cosmic-text already pulls into the lock — with every default
# feature (std, fs, memmap, fontconfig) already unified on — so no
# new code enters the build.
fontdb = "0.23"
log = "0.4"
open = "5.3.2"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time"] }

# Queryable state on the app's owned bus name (dbus-state spec): direct
# zbus dep, version-matched to the lock's 5.19 line that libcosmic and
# notify-rust already pull in so no new code enters the build.
# default-features = false mirrors libcosmic's own zbus declaration and
# selects the tokio executor (the app's executor is tokio-backed); the
# `p2p` feature exists for the headless peer-to-peer wire tests only.
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }

# The completions data file's format (suggest-specs-data spec):
# `completions.toml` beside the config parses through serde with
# `deny_unknown_fields` everywhere — the no-scripts boundary made
# structural. Version-matched to the 0.5.11 line the lock already
# carries, so no new code enters the build.
toml = "0.5"

# The completions data file's directory (suggest-specs-data spec):
# `dirs::config_dir()` is the same resolution cosmic-config performs
# for the config keys the file rides beside. Version-matched to the
# 6.0.0 line cosmic-config already pulls into the lock, so no new
# code enters the build.
dirs = "6"

[dependencies.cosmic-text]
version = "0.19"
features = ["monospace_fallback", "shape-run-cache"]

[dependencies.libcosmic]
workspace = true
# The terminal's libcosmic features live behind the default-on
# `terminal` package feature instead of here: the applet consumes this
# crate's lib target with `default-features = false`, and features
# listed directly on the dependency would unify into the applet's
# build — handing it the wgpu renderer the panel surface must not use.
features = []

[features]
default = ["terminal"]
# Everything the terminal bin needs beyond the lib target's plain zbus
# contract. `wgpu` must stay in here (never on the applet path): on
# panel layer-shell surfaces the wgpu renderer fails to bind the GPU
# and silently falls back to llvmpipe software rendering; tiny_skia is
# the renderer stock COSMIC applets use.
terminal = [
    "libcosmic/wayland",
    "libcosmic/wgpu",
    "libcosmic/tokio",
    "libcosmic/dbus-config",
    "libcosmic/single-instance",
]
# Re-identifies the terminal as `io.github.l1br3_io.CosmicExtDropterm.Dev`
# — its own single-instance slot, bus name, config file, state
# directory, and namespace — so a dev build never shares runtime
# identity with an installed release. Never default: release artifacts
# carry the plain identity. The applet's same-named feature enables
# this one so both ends of the D-Bus contract move together.
dev-identity = []

[dev-dependencies]
# The config-key ↔ docs sync test enumerates `DropTermConfig`'s
# serialized keys via `serde_json::to_value`. Version-matched to the
# 1.0.151 line the libcosmic tree already pulls into the lock, so no
# new code enters the build.
serde_json = "1"

[profile.release]
lto = true
strip = true

[profile.release-with-debug]
inherits = "release"
lto = false
strip = false
debug = true
