# The cutover's root (gpui-cutover Task 1): a virtual workspace —
# the libcosmic frontend crate that used to be the root package is
# deleted, not parked (the chunk's ruling), and the terminal crate is
# `dropterm` (the renamed GPUI frontend, `dropterm-gpui/`), with
# `dropterm-core` and the applet beside it. Git history keeps the
# deleted frontend.
[workspace]
members = ["applet", "dropterm-core", "dropterm-gpui"]
resolver = "3"

[workspace.dependencies]
# The applet's toolkit (the terminal crate needs none of it since the
# cutover). Bare URL, deliberately: libcosmic's own `applet` feature
# pulls cosmic-panel-config → cosmic-config from `pop-os/libcosmic`
# floating, and cargo only merges git references into ONE source when
# the spec strings match — a `rev =` pin here would put a second
# libcosmic source in the graph and break `cargo vendor` (duplicate
# crates). Reproducibility lives in the committed Cargo.lock (every
# recipe runs --locked); bump deliberately with
# `cargo update -p libcosmic --precise <sha>`.
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false }

# status-exit (OQ-1, decided 2026-11-03): the shell's own "command
# finished with code N" (OSC 133;D, FinalTerm/contour shell
# integration) is parsed nowhere upstream — vte 0.15.0's ansi table
# log-drops unknown codes and alacritty_terminal 0.25.1 holds no
# parser at all. Two one-arm forks carry the passthrough (branch
# dropterm-osc133d each, based on the exact crates.io publish
# commits, so the patched sources are the lockfile's versions plus
# the one arm): vte parses `133;D;<code>` into a default-no-op
# Handler method; alacritty_terminal implements it on Term, emitting
# Event::PromptExit(code). Unlike the bare libcosmic git URL above, a
# [patch.crates-io] entry REPLACES each crate's registry source
# rather than adding a second one, so cargo vendor still sees one
# source per crate. Upstreaming: PRs to alacritty/vte and
# alacritty/alacritty are the follow-up once the module proves out.
[patch.crates-io]
vte = { git = "https://github.com/l1br3-io/vte", rev = "52dadb7b7ccc0429439c662490bd603824bd35c0" }
alacritty_terminal = { git = "https://github.com/l1br3-io/alacritty", rev = "1185ffd98e1c16345230188fb02682a44bdefa3e" }
# The Kit's Root auto-border, carried (plan open questions item 7,
# ruled 2026-11-13): gpui-component 0.9.1 hard-codes a 20 px window
# border with no public opt-out, and Wayland forces Client decorations
# on every surface — inflating a layer surface 2×20 px on both axes (a
# 1280×320 drawer negotiates 1320×360). This path patch REPLACES the
# registry source with a private copy of the exact 0.9.1 sources whose
# single change zeroes the Linux `SHADOW_SIZE` const — never a public
# fork. The upgrade ritual and the verification every bump re-runs
# (the C2b kill check + a flush-edges screenshot, both compositors)
# live in docs/development.md's carried-patches section; the durable
# record is docs/research/kit-root-border.md. Retirement: an upstream
# per-window border opt-out (the ask stays the owner's outward action).
gpui-component = { path = "carried/gpui-component" }
