[package]
name = "dropterm-applet"
version = "0.5.0"
authors = ["l1br3-io"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"
description = "COSMIC panel applet that toggles DropTerm and shows its status"
repository = "https://github.com/l1br3-io/dropterm"

[dependencies]
env_logger = "0.11"

# Version-matched to the lock's 5.19 line (libcosmic already pulls
# zbus in); `default-features = false` selects the tokio executor and
# the `p2p` feature exists for the headless peer-to-peer wire tests
# only, mirroring the root package's declaration.
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }
# sync (mpsc) + time (timeouts) + process (child reaping for the
# launch path) for the applet's own use; the runtime feature set
# arrives through zbus's own tokio dependency.
tokio = { version = "1", features = ["sync", "time", "process"] }
log = "0.4"

# The V1 D-Bus contract proxy and its mock server for wire tests come
# from the toolkit-neutral core — one contract, one implementation.
# `default-features = false` carries the consumption pattern over
# verbatim (the shared-core planning ruling): only package features
# can be switched off from the consuming side, so the pattern stays
# even though the core owns no default features today.
dropterm-core = { path = "../dropterm-core", default-features = false }

# `wgpu` must never be added here: on panel (layer-shell) surfaces the
# wgpu renderer fails to bind the GPU and silently falls back to
# llvmpipe software rendering. tiny_skia is the renderer stock COSMIC
# applets use; it arrives through libcosmic's own iced dependency.
# `single-instance` is equally forbidden: a second applet instance
# would just forward-activate the terminal and exit, leaving a blank
# panel slot.
[dependencies.libcosmic]
workspace = true
features = ["applet", "applet-token", "tokio", "wayland"]

[features]
# Re-identifies the applet as `io.github.l1br3_io.dropterm.Applet.Dev`
# and switches its terminal summon to the dev launcher — a second
# panel entry that coexists with an installed applet. Enables the
# core crate's same-named feature (which the terminal bin also
# forwards to) so both ends of the D-Bus contract move together.
# Never default: release artifacts carry the plain identity.
dev-identity = ["dropterm-core/dev-identity"]
