[package]
name = "dropterm-gpui"
version = "0.5.0"
authors = ["l1br3-io"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"
description = "DropTerm's GPUI frontend (Phase 3 portability: the second binary beside the libcosmic one; ships nothing until cutover)"
repository = "https://github.com/l1br3-io/dropterm"

[[bin]]
name = "dropterm-gpui"
path = "src/main.rs"

[dependencies]
# The ruled pin (plan open questions item 8, ruled 2026-11-13 on the
# Kit pass's recommendation): published crates, never a zed git pin —
# gpui-pre exact at 0.3.12 (the crates.io snapshot of zed
# d2a4fb6ded7c470be25d1541281da3882495b65b, the rev the spike ran its
# checks on), default features off, wayland + font-kit only — exactly
# the set the Kit itself consumes. GPUI's x11/macOS features are
# Phase 4–5's call and never enter here. gpui-pre-platform rides the
# same exact version; its `wayland` feature is the consumer-side
# switch into the Linux crate's wayland backend.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["wayland", "font-kit"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland"] }

# The Kit (plan item 7's adoption, kit-pass C2b/C3): gpui-component
# exact at 0.9.1, component-only — default features off, never the
# gpui-kit aggregate, never gpui-shell; windows stay embedder-owned
# (cx.open_window + a manual Root wrap). Resolves to the carried copy
# through the root [patch.crates-io] (the Root auto-border, zeroed).
gpui-component = { version = "=0.9.1", default-features = false }

# The GPUI frontend's toolkit-neutral half: the served-state D-Bus
# contract, the startup transport (including the layer-shell verdict),
# and the APP_ID identity const.
dropterm-core = { path = "../dropterm-core" }

# The layer-shell startup probe (gpui-scaffold Task 3): one registry
# roundtrip before any surface exists, on this binary's own
# connection — the same direct-dependency ruling the libcosmic
# frontend's guard took (no existing dependency exposes a usable
# connection). Version-matched to the 0.31 line both gpui-pre and the
# libcosmic tree already carry in the lock.
wayland-client = "0.31"

# The CLI surface (gpui-scaffold Task 4): the surface verbs'
# derive-based parser, the frontend's own line. Version-matched to the
# 4.x line the lock already carries.
clap = { version = "4", features = ["derive"] }

# The control bus beside the render loop (gpui-scaffold Task 4): the
# served loop's own multi-thread runtime and the forwarded-verb channel
# (`rt-multi-thread` + `sync`; core's zbus tokio feature already rides
# the same 1.x line in the lock). No timers of our own — the drainer
# blocks on the channel instead.
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# The served connection itself (gpui-scaffold Task 4): the builder, the
# name request, and the changed-helper emission this frontend drives
# directly — the root crate's own line verbatim (default features off,
# the tokio executor), so all three members ride the same zbus.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[features]
# Re-identifies the frontend as `io.github.l1br3_io.dropterm.Dev` —
# its own single-instance slot, bus name, and namespace — riding the
# same pattern as every other member: the const lives in core, this
# feature only forwards to it. Never default: release artifacts carry
# the plain identity.
dev-identity = ["dropterm-core/dev-identity"]
