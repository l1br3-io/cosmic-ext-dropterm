name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream

      # The pop-os validate-desktop-files shape (desktop-file-validate
      # on every .desktop) plus the Flathub bar for the metainfo:
      # zero errors AND zero warnings. --no-net skips URL liveness —
      # the repo's own URLs are the project homepage, not something a
      # validator should gate on.
      - name: Validate desktop files
        run: |
          desktop-file-validate res/io.github.l1br3_io.CosmicExtDropterm.desktop
          desktop-file-validate res/io.github.l1br3_io.CosmicExtDropterm.Applet.desktop

      - name: Validate AppStream metainfo
        run: |
          appstreamcli validate --no-net res/io.github.l1br3_io.CosmicExtDropterm.metainfo.xml

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libfontconfig-dev \
            libfreetype-dev libexpat1-dev pkg-config

      # 24.04's apt `just` (1.14) predates the justfile's `set quiet`;
      # the official installer is arch-aware for the release matrix.
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # CI mirrors the maintainer's local gate (`just check` on
      # rustc 1.97): floating stable drifts ahead of it — 1.99's
      # clippy already flags pre-existing test code (`assert_is_empty`
      # & co) that the local gate accepts. Bump this with the local
      # toolchain.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: just fmt-check

      - name: Clippy
        run: just clippy

      - name: Test
        run: just test

      - name: Docs links
        run: just docs-check

      - name: Build (release)
        run: just build-release
