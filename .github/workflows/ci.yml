name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream

      # The pop-os validate-desktop-files shape (desktop-file-validate
      # on every .desktop) plus the Flathub bar for the metainfo:
      # zero errors AND zero warnings. --no-net skips URL liveness —
      # the repo's own URLs are the project homepage, not something a
      # validator should gate on.
      - name: Validate desktop files
        run: |
          desktop-file-validate res/io.github.l1br3_io.dropterm.desktop
          desktop-file-validate res/io.github.l1br3_io.dropterm.Applet.desktop

      - name: Validate AppStream metainfo
        run: |
          appstreamcli validate --no-net res/io.github.l1br3_io.dropterm.metainfo.xml
          appstreamcli validate --no-net res/io.github.l1br3_io.dropterm.Applet.metainfo.xml

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libfontconfig-dev \
            libfreetype-dev libexpat1-dev pkg-config

      # 24.04's apt `just` (1.14) predates the justfile's `set quiet`;
      # the official installer is arch-aware for the release matrix.
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # CI mirrors the maintainer's local gate (`just check` on
      # rustc 1.97): floating stable drifts ahead of it — 1.99's
      # clippy already flags pre-existing test code (`assert_is_empty`
      # & co) that the local gate accepts. Bump this with the local
      # toolchain.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: just fmt-check

      - name: Clippy
        run: just clippy

      - name: Test
        run: just test

      - name: Docs links
        run: just docs-check

      - name: Build (release)
        run: just build-release

  # The macOS build+test gate (macos-build mb-4): the crate compiles
  # and its toolkit-neutral core tests run green on the mac target.
  # Not a live session (the owner walks those); `cargo test` here is
  # the CI exception the plan's ruling names. rustc 1.98 is the
  # floor, not the ubuntu job's 1.97: gpui-pre-apple 0.3.12 uses
  # Option::map_or_default (rust#138099), stable only since 1.98 —
  # the wayland backend the ubuntu job compiles never sees it.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # gpui-pre-apple's build script compiles Metal shaders, and
      # Xcode 26+ ships the metal toolchain as a downloadable
      # component the runner image may not preinstall. A no-op fast
      # pass when present; the download only runs when missing. The
      # build itself stays the real gate.
      - name: Ensure Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2

      - name: Build (arm64)
        run: cargo build --locked --verbose

      # Clippy on the mac target itself: every paired non-Linux arm
      # is code the ubuntu job's clippy never compiles, so the mac
      # job lint-checks them here — the same two invocations `just
      # clippy` makes (workspace + dev-identity), pinned to the same
      # 1.98 the job builds with.
      - name: Clippy (arm64)
        run: cargo clippy --all-targets --workspace --locked -- -D warnings

      - name: Clippy (arm64, dev-identity)
        run: cargo clippy --all-targets -p dropterm --locked --features dev-identity -- -D warnings

      - name: Test (arm64)
        run: cargo test --locked

      - name: Check (x86_64)
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --locked --target x86_64-apple-darwin
